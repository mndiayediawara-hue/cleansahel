<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e3a8a">
  <title>SAHEL - Entregas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111827; min-height: 100vh; }
    .header { background: #1e3a8a; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
    .logo { width: 32px; height: 32px; background: white; color: #1e3a8a; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 12px; flex-shrink: 0; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .sub { font-size: 10px; opacity: .85; }
    .container { max-width: 600px; margin: 0 auto; padding: 12px; }
    .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 10px; }
    .card h2 { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
    .scanner-box { width: 100%; aspect-ratio: 1; max-height: 280px; background: #000; border-radius: 8px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .scanner-box video { width: 100%; height: 100%; object-fit: cover; }
    .scanner-placeholder { color: #6b7280; text-align: center; padding: 20px; font-size: 13px; }
    .scanner-btn { background: #1e3a8a; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: block; margin: 0 auto; }
    .scanner-btn.stop { background: #dc2626; }
    .manual-input { display: flex; gap: 6px; margin-top: 10px; }
    .manual-input input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; }
    .manual-input input:focus { outline: none; border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30,58,138,.15); }
    .manual-input button { background: #1e3a8a; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .customer-info { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 10px; }
    .customer-info h3 { font-size: 17px; color: #111827; margin-bottom: 4px; }
    .code { display: inline-block; background: #1e3a8a; color: white; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
    .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .order { background: white; border-radius: 8px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 8px; border-left: 4px solid #1e3a8a; }
    .order-delivered { background: #f0fdf4; border-left-color: #10b981; }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-number { font-family: monospace; font-weight: 600; color: #1e3a8a; font-size: 14px; }
    .order-total { font-size: 17px; font-weight: 700; color: #111827; margin: 6px 0; }
    .order-items { font-size: 12px; color: #4b5563; padding: 6px 0; border-top: 1px solid #e5e7eb; }
    .order-btn { width: 100%; background: #10b981; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .order-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .delivered-info { font-size: 12px; color: #047857; margin-top: 6px; font-style: italic; }
    .empty { text-align: center; padding: 24px 12px; color: #6b7280; }
    .login-box { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); text-align: center; max-width: 360px; margin: 40px auto; }
    .login-box input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .login-box button { width: 100%; background: #1e3a8a; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; font-family: inherit; }
    .login-error { color: #dc2626; font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 10px 16px; border-radius: 6px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.2s; white-space: nowrap; }
    .toast.show { opacity: 1; }
    .logout { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    #qr-reader { width: 100% !important; border-radius: 8px; }
    #qr-reader video { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SH</div>
    <div style="flex:1">
      <h1>SAHEL · Entregas</h1>
      <div class="sub">Escanear QR o introducir código</div>
    </div>
    <button id="logoutBtn" class="logout hidden" onclick="doLogout()">Salir</button>
  </div>
  <div class="container">
    <div id="loginSection" class="login-box hidden">
      <p style="color: #6b7280; margin-bottom: 12px;">Inicia sesión para continuar</p>
      <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username" />
      <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" />
      <button onclick="doLogin()">Iniciar sesión</button>
      <div id="loginError" class="login-error hidden"></div>
    </div>
    <div id="mainSection" class="hidden">
      <div class="card">
        <h2>1. Escanear QR del cliente</h2>
        <div id="scanner-box" class="scanner-box">
          <div id="scanner-placeholder" class="scanner-placeholder">
            Clic en "Iniciar cámara" para escanear<br><br>
            <small style="color:#9ca3af; font-size:11px;">El QR está en la tarjeta del cliente</small>
          </div>
          <div id="qr-reader" style="display:none; width:100%;"></div>
        </div>
        <button id="scanBtn" class="scanner-btn" onclick="toggleScanner()">Iniciar cámara</button>
        <div style="text-align:center; color:#6b7280; font-size:11px; margin:10px 0 0;">— o introduce el código manualmente —</div>
        <div class="manual-input">
          <input type="text" id="codeInput" placeholder="CL-00001" autocomplete="off" />
          <button onclick="lookupCustomer()">Buscar</button>
        </div>
      </div>
      <div id="resultSection"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    var API = 'https://cleansahel.onrender.com/api'
    var token = localStorage.getItem('cleanerp-token') || null
    var STORAGE_KEY = 'cleanerp-token'
    var html5QrcodeScanner = null
    var scannerRunning = false

    function init() {
      if (!token) token = localStorage.getItem(STORAGE_KEY)
      if (token) showMain()
      else document.getElementById('loginSection').classList.remove('hidden')
    }

    function showToast(msg, color) {
      var t = document.getElementById('toast')
      t.textContent = msg
      t.style.background = color || '#1f2937'
      t.classList.add('show')
      setTimeout(function() { t.classList.remove('show') }, 2500)
    }

    async function doLogin() {
      var username = document.getElementById('loginUser').value.trim()
      var password = document.getElementById('loginPass').value
      var errEl = document.getElementById('loginError')
      if (!username || !password) {
        errEl.textContent = 'Introduce usuario y contraseña'
        errEl.classList.remove('hidden')
        return
      }
      try {
        var res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
        var data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Credenciales incorrectas')
        token = data.token
        localStorage.setItem(STORAGE_KEY, token)
        document.getElementById('loginSection').classList.add('hidden')
        showMain()
      } catch(e) {
        errEl.textContent = e.message
        errEl.classList.remove('hidden')
      }
    }

    function doLogout() {
      if (scannerRunning) stopScanner()
      localStorage.removeItem(STORAGE_KEY)
      token = null
      document.getElementById('mainSection').classList.add('hidden')
      document.getElementById('loginSection').classList.remove('hidden')
      document.getElementById('resultSection').innerHTML = ''
    }

    function showMain() {
      document.getElementById('mainSection').classList.remove('hidden')
      document.getElementById('logoutBtn').classList.remove('hidden')
      document.getElementById('loginSection').classList.add('hidden')
    }

    function toggleScanner() {
      if (scannerRunning) {
        stopScanner()
      } else {
        startScanner()
      }
    }

    function startScanner() {
      if (typeof Html5Qrcode === 'undefined') {
        showToast('Escáner no disponible', '#dc2626')
        return
      }
      document.getElementById('scanner-placeholder').style.display = 'none'
      document.getElementById('qr-reader').style.display = 'block'
      var btn = document.getElementById('scanBtn')
      btn.textContent = 'Cargando...'
      btn.disabled = true
      try {
        html5QrcodeScanner = new Html5Qrcode('qr-reader')
        html5QrcodeScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          function(decodedText) {
            stopScanner()
            var codeMatch = decodedText.match(/CL-\d{4,6}/)
            var code = codeMatch ? codeMatch[0] : decodedText.trim().toUpperCase()
            document.getElementById('codeInput').value = code
            lookupCustomer()
          },
          function() {}
        ).then(function() {
          scannerRunning = true
          btn.textContent = 'Detener cámara'
          btn.disabled = false
          btn.classList.add('stop')
        }).catch(function(err) {
          showToast('Error al acceder a la cámara: ' + err, '#dc2626')
          document.getElementById('scanner-placeholder').style.display = 'flex'
          document.getElementById('qr-reader').style.display = 'none'
          btn.textContent = 'Iniciar cámara'
          btn.disabled = false
        })
      } catch(e) {
        showToast('Error: ' + e.message, '#dc2626')
        btn.textContent = 'Iniciar cámara'
        btn.disabled = false
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner && scannerRunning) {
        html5QrcodeScanner.stop().then(function() {
          scannerRunning = false
          html5QrcodeScanner = null
        }).catch(function() {})
      }
      document.getElementById('scanner-placeholder').style.display = 'flex'
      document.getElementById('qr-reader').style.display = 'none'
      var btn = document.getElementById('scanBtn')
      if (btn) {
        btn.textContent = 'Iniciar cámara'
        btn.disabled = false
        btn.classList.remove('stop')
      }
    }

    async function lookupCustomer() {
      if (scannerRunning) stopScanner()
      var code = document.getElementById('codeInput').value.trim().toUpperCase()
      if (!code) { showToast('Introduce un código', '#dc2626'); return }
      document.getElementById('codeInput').value = code
      try {
        var res = await fetch(API + '/delivery/lookup/' + encodeURIComponent(code), {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        if (res.status === 401) {
          showToast('Sesión expirada', '#dc2626')
          doLogout()
          return
        }
        if (res.status === 404) {
          showToast('Cliente no encontrado: ' + code, '#dc2626')
          document.getElementById('resultSection').innerHTML = ''
          return
        }
        if (!res.ok) throw new Error('Error al buscar cliente')
        var data = await res.json()
        renderCustomer(data)
      } catch(e) { showToast('Error: ' + e.message, '#dc2626') }
    }

    function renderCustomer(data) {
      var c = data.customer
      var orders = data.pendingOrders || []
      var delivered = data.deliveredOrders || []
      var html = '<div class="customer-info"><h3>' + esc(c.name) + '</h3><span class="code">' + esc(c.code) + '</span>'
      if (c.company) html += '<div class="meta">' + esc(c.company) + '</div>'
      if (c.phone) html += '<div class="meta">Tel: ' + esc(c.phone) + '</div>'
      if (c.address) html += '<div class="meta">' + esc(c.address) + (c.city ? ', ' + esc(c.city) : '') + '</div>'
      html += '</div>'
      if (orders.length === 0 && delivered.length === 0) {
        html += '<div class="empty">No hay pedidos para este cliente</div>'
      } else {
        if (orders.length > 0) {
          html += '<div class="card"><h2>Pedidos pendientes (' + orders.length + ')</h2>'
          for (var i = 0; i < orders.length; i++) {
            var o = orders[i]
            html += '<div class="order"><div class="order-header"><span class="order-number">' + esc(o.number) + '</span><span class="badge badge-ok">Pendiente</span></div>'
            html += '<div class="order-total">' + formatC(o.total) + '</div>'
            if (o.items && o.items.length > 0) {
              var itemsHtml = []
              for (var j = 0; j < o.items.length; j++) {
                var item = o.items[j]
                itemsHtml.push(esc(item.product_name || item.name || 'Item') + ' x' + item.quantity + ' (' + formatC(item.unit_price || item.price || 0) + ')')
              }
              html += '<div class="order-items">' + itemsHtml.join('<br>') + '</div>'
            }
            html += '<button class="order-btn" id="btn-' + o.id + '" onclick="markDelivered(\'' + o.id + '\')">Marcar como entregado ✓</button></div>'
          }
          html += '</div>'
        }
        if (delivered.length > 0) {
          html += '<div class="card"><h2>Entregados (' + delivered.length + ')</h2>'
          for (var k = 0; k < delivered.length; k++) {
            var d = delivered[k]
            html += '<div class="order order-delivered"><div class="order-header"><span class="order-number">' + esc(d.number) + '</span><span class="badge badge-ok">Entregado</span></div>'
            html += '<div class="order-total">' + formatC(d.total) + '</div>'
            if (d.delivered_at) html += '<div class="delivered-info">Entregado el ' + new Date(d.delivered_at).toLocaleString('es-SN') + '</div>'
            html += '</div>'
          }
          html += '</div>'
        }
      }
      document.getElementById('resultSection').innerHTML = html
    }

    async function markDelivered(orderId) {
      if (!confirm('¿Confirmar la entrega de este pedido?')) return
      var btn = document.getElementById('btn-' + orderId)
      if (btn) { btn.disabled = true; btn.textContent = 'Guardando...' }
      try {
        var res = await fetch(API + '/delivery/' + orderId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
        })
        if (!res.ok) {
          var err = await res.json()
          throw new Error(err.error || 'Error al entregar')
        }
        showToast('¡Pedido entregado! ✓', '#10b981')
        var code = document.getElementById('codeInput').value.trim()
        if (code) lookupCustomer()
      } catch(e) {
        showToast('Error: ' + e.message, '#dc2626')
        if (btn) { btn.disabled = false; btn.textContent = 'Marcar como entregado ✓' }
      }
    }

    function esc(s) {
      if (!s) return ''
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    function formatC(n) { return (n||0).toLocaleString('es-SN', {minimumFractionDigits:0}) + ' FCFA' }

    init()
  </script>
</body>
</html>
