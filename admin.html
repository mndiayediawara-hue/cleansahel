<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control - CleanSahel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f1f5f9; font-size: 14px; }
.header { background: linear-gradient(135deg, #7c3aed, #2563eb); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; }
.header-info { display: flex; gap: 12px; align-items: center; font-size: 12px; }
.container { max-width: 1100px; margin: 0 auto; padding: 16px; }
.tabs { display: flex; gap: 2px; background: #1e293b; border-radius: 6px 6px 0 0; padding: 0 4px; border-bottom: 1px solid #334155; }
.tab { padding: 10px 16px; cursor: pointer; background: transparent; color: #94a3b8; font-weight: 500; border: none; border-bottom: 2px solid transparent; font-size: 13px; }
.tab.active { background: #0f172a; color: #a78bfa; border-bottom-color: #7c3aed; }
.tab-content { background: #1e293b; border-radius: 0 0 6px 6px; padding: 16px; min-height: 400px; }
.section { display: none; }
.section.active { display: block; }

/* Lista de usuarios - COMPACTA */
.user-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; border: 1px solid #334155; flex-wrap: wrap; }
.user-row .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
.user-row .info { flex: 1; min-width: 120px; }
.user-row .info .name { font-weight: 600; font-size: 13px; }
.user-row .info .full { font-size: 11px; color: #94a3b8; }
.user-row .role { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; color: #fff; }
.user-row .role.admin { background: #7c3aed; }
.user-row .role.produccion { background: #2563eb; }
.user-row .role.contabilidad { background: #0891b2; }
.user-row .role.operario { background: #475569; }
.user-row .status { font-size: 12px; }
.user-row .status.active { color: #22c55e; }
.user-row .status.inactive { color: #ef4444; }
.user-row .actions { display: flex; gap: 4px; flex-wrap: wrap; }
.user-row .actions button { background: #334155; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.user-row .actions button:hover { background: #475569; }
.user-row .actions button.danger { background: #dc2626; }
.user-row .actions button.warn { background: #f59e0b; }
.user-row .actions button.success { background: #16a34a; }
.user-row .actions button:disabled { opacity: .4; cursor: not-allowed; }

/* Botones globales */
button { background: #7c3aed; color: #fff; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500; }
button:hover { opacity: .9; }
button.success { background: #16a34a; }
button.danger { background: #dc2626; }
button.warn { background: #f59e0b; }
button.gray { background: #475569; }
button.small { padding: 4px 8px; font-size: 11px; }
input, select, textarea { padding: 7px 9px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #f1f5f9; font-size: 13px; width: 100%; }
label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal-bg.active { display: flex; }
.modal { background: #0f172a; border-radius: 10px; max-width: 500px; width: 100%; max-height: 85vh; overflow: auto; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6); border: 1px solid #334155; }
.modal h3 { color: #a78bfa; margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.modal h3 button { background: transparent; color: #94a3b8; font-size: 20px; padding: 0 4px; }
.modal h3 button:hover { color: #fff; opacity: 1; }

/* Matriz de permisos */
.perms-grid { display: grid; grid-template-columns: 1fr repeat(4, 50px); gap: 4px; font-size: 12px; }
.perms-grid .header { background: #334155; padding: 6px; text-align: center; font-weight: 600; }
.perms-grid .mod { background: #0f172a; padding: 6px; display: flex; align-items: center; gap: 6px; }
.perms-grid .cell { background: #0f172a; padding: 6px; text-align: center; }
.perms-grid .cell input { width: 16px; height: 16px; cursor: pointer; }
.perms-grid .admin-note { background: #0f172a; padding: 8px; text-align: center; color: #a78bfa; font-size: 11px; font-style: italic; }

.toast { position: fixed; top: 16px; right: 16px; z-index: 2000; padding: 10px 16px; border-radius: 6px; color: #fff; font-weight: 500; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.3); max-width: 320px; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
.toast.info { background: #2563eb; }
.muted { color: #94a3b8; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.flex { display: flex; gap: 8px; align-items: center; }
.flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.empty { text-align: center; padding: 30px; color: #64748b; }
.search { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 5px; color: #f1f5f9; font-size: 13px; margin-bottom: 12px; }

/* Buscador de modulos */
.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.mod-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; cursor: pointer; }
.mod-card:hover { border-color: #7c3aed; }
.mod-card .icon { font-size: 20px; }
.mod-card .name { font-weight: 500; font-size: 13px; margin-top: 4px; }
.mod-card .path { font-size: 10px; color: #64748b; }

/* Acciones */
.act-section { background: #0f172a; border-radius: 6px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; }
.act-section h4 { color: #f1f5f9; font-size: 13px; margin-bottom: 8px; }
.act-item { display: inline-flex; align-items: center; gap: 6px; background: #1e293b; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
.act-item button { background: #dc2626; padding: 2px 6px; font-size: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>⚙️ Panel de Control</h1>
  <div class="header-info">
    <span id="user-info"></span>
    <button onclick="logout()" class="small gray">Salir</button>
  </div>
</div>
<div class="container">
  <div id="login-screen" class="empty" style="display:none;">
    <h2 style="color:#a78bfa;">Iniciar sesión</h2>
    <p class="muted" style="margin:8px 0 16px;">Como admin para gestionar usuarios</p>
    <div style="max-width:300px;margin:0 auto;">
      <div style="margin-bottom:8px;"><label>Usuario</label><input id="li-user" value="admin"></div>
      <div style="margin-bottom:12px;"><label>Contraseña</label><input id="li-pass" type="password"></div>
      <button onclick="doLogin()" style="width:100%;">Entrar</button>
      <p id="li-err" style="color:#fca5a5;margin-top:8px;display:none;"></p>
    </div>
  </div>
  <div id="main-screen" style="display:none;">
    <div class="flex-between" style="margin-bottom:12px;">
      <h2 style="color:#a78bfa;font-size:16px;margin:0;">Gestión de Usuarios</h2>
      <button onclick="openNewUser()" class="success">+ Nuevo Usuario</button>
    </div>
    <div id="users-list"></div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const API = 'https://cleansahel-production.up.railway.app/api';

function getToken() { return localStorage.getItem('admin-token') || ''; }
function getUser() {
  try { return JSON.parse(localStorage.getItem('admin-user') || 'null'); } catch { return null; }
}
function setSession(token, user) {
  localStorage.setItem('admin-token', token);
  localStorage.setItem('admin-user', JSON.stringify(user));
}
function clearSession() {
  localStorage.removeItem('admin-token');
  localStorage.removeItem('admin-user');
}

async function api(path, method = 'GET', body = null) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
    body: body ? JSON.stringify(body) : null
  });
  if (!res.ok) {
    const txt = await res.text();
    let msg = 'Error ' + res.status;
    try { msg = JSON.parse(txt).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

function toast(text, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => { try { t.remove(); } catch {} }, 3000);
}

function logout() {
  clearSession();
  showLogin();
}

async function doLogin() {
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const err = document.getElementById('li-err');
  err.style.display = 'none';
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (!r.ok) throw new Error('Credenciales incorrectas');
    const data = await r.json();
    setSession(data.token, data.user);
    showMain();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('li-pass').focus();
}

function showMain() {
  const u = getUser();
  if (!u) { showLogin(); return; }
  if (u.role !== 'admin') { alert('Solo admin'); clearSession(); showLogin(); return; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('user-info').innerHTML = '<b>' + u.username + '</b> (admin)';
  loadUsers();
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// Click fuera del modal cierra
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

async function loadUsers() {
  const el = document.getElementById('users-list');
  el.innerHTML = 'Cargando...';
  try {
    const users = await api('/users');
    if (users.length === 0) { el.innerHTML = '<div class="empty">Sin usuarios</div>'; return; }
    const me = getUser();
    let html = '';
    for (const u of users) {
      const initial = (u.username || '?').charAt(0).toUpperCase();
      const isMe = me && me.id === u.id;
      html += `
        <div class="user-row">
          <div class="avatar">${initial}</div>
          <div class="info">
            <div class="name">${u.username}${isMe ? ' (tú)' : ''}</div>
            <div class="full">${u.fullName || ''}</div>
          </div>
          <span class="role ${u.role}">${u.role}</span>
          <span class="status ${u.active ? 'active' : 'inactive'}">${u.active ? '🟢' : '🔴'}</span>
          <div class="actions">
            <button class="${u.active ? 'warn' : 'success'}" onclick="toggleUser('${u.id}', ${!u.active}, '${u.username}')" ${isMe ? 'disabled title="No puedes desactivarte"' : ''}>${u.active ? 'Desactivar' : 'Activar'}</button>
            <button onclick="openEditUser('${u.id}')">✏️ Editar</button>
            <button class="warn" onclick="openChangePwd('${u.id}', '${u.username}')">🔑 Pwd</button>
            <button onclick="openPerms('${u.id}', '${u.username}', '${u.role}')">🔐 Permisos</button>
            <button class="danger" onclick="delUser('${u.id}', '${u.username}')" ${isMe ? 'disabled title="No puedes eliminarte"' : ''}>🗑️</button>
          </div>
        </div>
      `;
    }
    el.innerHTML = html;
  } catch (e) { el.innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

async function toggleUser(id, active, username) {
  if (active && !confirm('¿Activar al usuario ' + username + '?')) return;
  if (!active && !confirm('¿Desactivar al usuario ' + username + '?')) return;
  try {
    await api('/users/' + id + '/status', 'PUT', { active });
    toast(active ? 'Activado' : 'Desactivado', 'success');
    closeModal();
    loadUsers();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

async function openEditUser(id) {
  try {
    const users = await api('/users');
    const u = users.find(x => x.id === id);
    if (!u) return;
    showModal(`
      <h3>✏️ Editar Usuario <button onclick="closeModal()">×</button></h3>
      <div class="row">
        <div><label>Nombre Completo</label><input id="e-fullname" value="${(u.fullName || '').replace(/"/g, '&quot;')}"></div>
        <div><label>Email</label><input id="e-email" value="${(u.email || '').replace(/"/g, '&quot;')}" type="email"></div>
      </div>
      <div class="row">
        <div><label>Rol</label>
          <select id="e-role">
            <option value="operario" ${u.role === 'operario' ? 'selected' : ''}>Operario</option>
            <option value="produccion" ${u.role === 'produccion' ? 'selected' : ''}>Producción</option>
            <option value="contabilidad" ${u.role === 'contabilidad' ? 'selected' : ''}>Contabilidad</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
          </select>
        </div>
        <div><label>Username (no editable)</label><input value="${u.username}" disabled></div>
      </div>
      <div class="flex" style="justify-content:flex-end;margin-top:12px;">
        <button class="gray" onclick="closeModal()">Cancelar</button>
        <button class="success" onclick="saveEdit('${id}')">Guardar</button>
      </div>
    `);
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

async function saveEdit(id) {
  try {
    const data = {
      fullName: document.getElementById('e-fullname').value.trim(),
      email: document.getElementById('e-email').value.trim(),
      role: document.getElementById('e-role').value
    };
    await api('/users/' + id, 'PUT', data);
    toast('Usuario actualizado', 'success');
    closeModal();
    loadUsers();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

function openNewUser() {
  showModal(`
    <h3>+ Nuevo Usuario <button onclick="closeModal()">×</button></h3>
    <div class="row">
      <div><label>Usuario *</label><input id="n-username" required></div>
      <div><label>Nombre Completo *</label><input id="n-fullname" required></div>
    </div>
    <div class="row">
      <div><label>Email</label><input id="n-email" type="email"></div>
      <div><label>Rol *</label>
        <select id="n-role">
          <option value="operario">Operario</option>
          <option value="produccion">Producción</option>
          <option value="contabilidad">Contabilidad</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Contraseña * (min 4)</label><input id="n-password" type="password" required minlength="4"></div>
    </div>
    <div class="flex" style="justify-content:flex-end;margin-top:12px;">
      <button class="gray" onclick="closeModal()">Cancelar</button>
      <button class="success" onclick="saveNewUser()">Crear</button>
    </div>
  `);
}

async function saveNewUser() {
  try {
    const data = {
      username: document.getElementById('n-username').value.trim(),
      fullName: document.getElementById('n-fullname').value.trim(),
      email: document.getElementById('n-email').value.trim(),
      role: document.getElementById('n-role').value,
      password: document.getElementById('n-password').value
    };
    if (!data.username || !data.fullName || !data.password) { toast('Completa los campos requeridos', 'error'); return; }
    await api('/users', 'POST', data);
    toast('Usuario creado', 'success');
    closeModal();
    loadUsers();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

function openChangePwd(id, username) {
  showModal(`
    <h3>🔑 Cambiar contraseña: ${username} <button onclick="closeModal()">×</button></h3>
    <div class="row">
      <div><label>Nueva contraseña (min 4)</label><input id="p-new" type="password" required minlength="4" autofocus></div>
    </div>
    <div class="flex" style="justify-content:flex-end;margin-top:12px;">
      <button class="gray" onclick="closeModal()">Cancelar</button>
      <button class="warn" onclick="savePwd('${id}')">Cambiar</button>
    </div>
  `);
}

async function savePwd(id) {
  try {
    const np = document.getElementById('p-new').value;
    if (!np || np.length < 4) { toast('Mínimo 4 caracteres', 'error'); return; }
    await api('/users/' + id + '/password', 'PUT', { newPassword: np });
    toast('Contraseña cambiada', 'success');
    closeModal();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

async function openPerms(id, username, role) {
  if (role === 'admin') {
    showModal(`
      <h3>🔐 Permisos de ${username} <button onclick="closeModal()">×</button></h3>
      <div class="admin-note">Los administradores tienen TODOS los permisos automáticamente. No se puede editar.</div>
      <div class="flex" style="justify-content:flex-end;margin-top:12px;">
        <button class="gray" onclick="closeModal()">Cerrar</button>
      </div>
    `);
    return;
  }
  try {
    const users = await api('/users');
    const u = users.find(x => x.id === id);
    if (!u) return;
    const defs = await api('/permissions/defaults');
    const perms = u.permissions || {};
    let rows = '';
    for (const m of defs.modules) {
      const mp = perms[m.key] || {};
      rows += `
        <div class="mod">${m.label}</div>
        <div class="cell"><input type="checkbox" data-mod="${m.key}" data-act="view" ${mp.view ? 'checked' : ''}></div>
        <div class="cell"><input type="checkbox" data-mod="${m.key}" data-act="create" ${mp.create ? 'checked' : ''}></div>
        <div class="cell"><input type="checkbox" data-mod="${m.key}" data-act="edit" ${mp.edit ? 'checked' : ''}></div>
        <div class="cell"><input type="checkbox" data-mod="${m.key}" data-act="delete" ${mp.delete ? 'checked' : ''}></div>
      `;
    }
    showModal(`
      <h3>🔐 Permisos de ${username} <button onclick="closeModal()">×</button></h3>
      <p class="muted" style="font-size:11px;margin-bottom:8px;">Marca qué puede hacer (Ver/Crear/Editar/Eliminar) en cada módulo.</p>
      <div class="perms-grid">
        <div class="header">Módulo</div>
        <div class="header">Ver</div>
        <div class="header">Crear</div>
        <div class="header">Editar</div>
        <div class="header">Eliminar</div>
        ${rows}
      </div>
      <div class="flex" style="justify-content:space-between;margin-top:12px;">
        <button class="gray small" onclick="selectAllPerms()">Seleccionar todo</button>
        <div>
          <button class="gray" onclick="closeModal()">Cancelar</button>
          <button class="success" onclick="savePerms('${id}')">Guardar Permisos</button>
        </div>
      </div>
    `);
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

function selectAllPerms() {
  document.querySelectorAll('#modal-content input[type=checkbox]').forEach(cb => cb.checked = true);
}

async function savePerms(id) {
  try {
    const newPerms = {};
    document.querySelectorAll('#modal-content input[type=checkbox]').forEach(cb => {
      if (!newPerms[cb.dataset.mod]) newPerms[cb.dataset.mod] = {};
      newPerms[cb.dataset.mod][cb.dataset.act] = cb.checked;
    });
    await api('/users/' + id + '/permissions', 'PUT', { permissions: newPerms });
    toast('Permisos guardados', 'success');
    closeModal();
    loadUsers();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

async function delUser(id, username) {
  if (!confirm('¿Eliminar al usuario "' + username + '"?\n\nEsta acción no se puede deshacer.')) return;
  try {
    await api('/users/' + id, 'DELETE');
    toast('Eliminado', 'success');
    closeModal();
    loadUsers();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

// Login on enter
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Inicializar
if (getUser() && getToken()) showMain();
else showLogin();
</script>
</body>
</html>
