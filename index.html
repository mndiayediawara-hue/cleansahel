<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo-bS6puxSp-bS6puxSp-bS6puxSp-bS6puxSp-bS6puxSp.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAHEL - Produits d'Hygiène</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="./assets/force-text-v4-1786466597.js"></script>
    <script src="./assets/i18n-patch.js"></script>
    <script src="./assets/lots-central-patch.js"></script>
    <script>
// =============================================================
// PATCH: Recepción integrada con generación de lote y etiqueta
// Elimina el apartado separado "Lotes de MP" del sidebar
// Integra el lote en el modal de "Materia prima nueva" y "Envases"
// Botón "Generar documento" aparece al guardar la recepción
// =============================================================

(function() {
  if (window.__receptionIntegratedPatchLoaded) return;
  window.__receptionIntegratedPatchLoaded = true;

  const API_BASE = (() => {
    const PN = (typeof window !== 'undefined' && window.PN) || '';
    return PN || 'https://cleansahel.onrender.com';
  })();

  const getToken = () => {
    try { return localStorage.getItem('cleanerp-token') || ''; } catch { return ''; }
  };

  const TYPE_INFO = {
    raw: { prefix: 'MP-', name: 'Materia Prima', icon: '🧪', unit: 'kg' },
    envase: { prefix: 'ENV-', name: 'Envase', icon: '🧴', unit: 'ud' },
    embalaje: { prefix: 'EMB-', name: 'Embalaje', icon: '📦', unit: 'ud' }
  };

  // 1. Obtener siguiente código de lote
  async function getNextCode(type) {
    try {
      const res = await fetch(`${API_BASE}/api/lots/next-code/${type}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.code;
    } catch { return null; }
  }

  // 2. Ocultar el botón "Lotes de MP" del sidebar
  function hideOldLotsButton() {
    const style = document.createElement('style');
    style.id = 'hide-lots-mp-sidebar';
    style.textContent = `
      /* Ocultar enlace "Lotes de MP" del sidebar (reemplazado por recepción integrada) */
      a[href="/raw-material-lots"], a[href*="/raw-material-lots"] {
        display: none !important;
      }
      /* O también el item del sidebar que contenga este texto */
      nav a:has(> *), aside a {
        /* Truco: si el texto es "Lotes de MP" */
      }
    `;
    if (!document.getElementById('hide-lots-mp-sidebar')) {
      document.head.appendChild(style);
    }
    // Más agresivo: ocultar todos los items del sidebar que contengan "Lotes de MP"
    document.querySelectorAll('a, button, [role="link"]').forEach(el => {
      const text = (el.textContent || '').trim();
      // Solo el item que tenga EXACTAMENTE "Lotes de MP" (no otro)
      if (text === 'Lotes de MP' || text === 'Lote de MP' || text === 'Lotes de Materias Primas') {
        const li = el.closest('li, [class*="item"], [class*="nav-"]');
        if (li) li.style.display = 'none';
        else el.style.display = 'none';
      }
    });
  }

  // 3. Interceptar fetch para detectar creación exitosa de lote
  //    (esto ya existe en el patch anterior)
  const originalFetch = window.fetch;
  window.fetch = async function(...args) {
    const [url, options] = args;
    const method = (options?.method || 'GET').toUpperCase();

    const isRawLot = typeof url === 'string' && url.includes('/raw-material-lots') && method === 'POST' && !url.match(/\/raw-material-lots\/[^/]+/);
    const isPkgLot = typeof url === 'string' && url.includes('/packaging-lots') && method === 'POST' && !url.match(/\/packaging-lots\/[^/]+/);
    const isNewMaterial = typeof url === 'string' && url.includes('/raw-materials') && method === 'POST' && !url.match(/\/raw-materials\/[^/]+/);

    if (isRawLot || isPkgLot) {
      try {
        const response = await originalFetch.apply(this, args);
        if (response.ok) {
          const clone = response.clone();
          try {
            const data = await clone.json();
            if (data?.id) {
              // Determinar tipo
              let type = 'raw';
              if (isPkgLot) {
                // Determinar si es envase o embalaje por prefijo del código
                const code = data.code || '';
                if (code.startsWith('EMB-')) type = 'embalaje';
                else type = 'envase';
              }
              setTimeout(() => {
                showReceptionSuccessModal(data, type);
              }, 100);
            }
          } catch (e) {}
        }
        return response;
      } catch (e) {
        return originalFetch.apply(this, args);
      }
    }

    return originalFetch.apply(this, args);
  };

  // Interceptar también creación de nueva materia prima
  window.fetch = (function(orig) {
    return async function(...args) {
      const [url, options] = args;
      const method = (options?.method || 'GET').toUpperCase();
      const isNewMat = typeof url === 'string' && url.includes('/raw-materials') && method === 'POST' && !url.match(/\/raw-materials\/[^/]+/);
      if (isNewMat) {
        try {
          const response = await orig.apply(this, args);
          if (response.ok) {
            const clone = response.clone();
            try {
              const data = await clone.json();
              if (data?.id) {
                setTimeout(() => {
                  showMaterialSuccessModal(data);
                }, 100);
              }
            } catch (e) {}
          }
          return response;
        } catch (e) {
          return orig.apply(this, args);
        }
      }
      return orig.apply(this, args);
    };
  })(window.fetch);

  // 4. Modal de éxito para materia prima nueva
  function showMaterialSuccessModal(matData) {
    const existing = document.getElementById('reception-success-modal');
    if (existing) existing.remove();
    const infoUrl = `${API_BASE}/api/reception-info/raw/${matData.id}`;
    const modal = document.createElement('div');
    modal.id = 'reception-success-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);animation:fadeIn 0.2s ease;';

    // Botón "Generar documento" - crea lote y abre etiqueta
    const handleGenerar = async function(btn) {
      btn.disabled = true;
      btn.innerHTML = '<span style="font-size:18px;">⏳</span><span>Creando lote...</span>';
      try {
        // 1. Obtener siguiente código de lote
        const codeRes = await fetch(`${API_BASE}/api/lots/next-code/raw`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (!codeRes.ok) throw new Error('No se pudo obtener el código de lote');
        const codeData = await codeRes.json();
        const lotCode = codeData.code;

        // 2. Crear el lote con los datos de la materia prima
        const lotRes = await fetch(`${API_BASE}/api/raw-material-lots`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify({
            internalLotNumber: lotCode,
            supplierLotNumber: '',
            rawMaterialId: matData.id,
            rawMaterialName: matData.name,
            unit: matData.unit || 'L',
            quantityReceived: matData.stock || 0,
            quantityRemaining: matData.stock || 0,
            receivedDate: new Date().toISOString().slice(0, 10),
            expiryDate: matData.expiryDate || '',
            status: 'activo',
            certificates: [],
            notes: `Lote creado automáticamente al registrar materia prima ${matData.code}`
          })
        });
        if (!lotRes.ok) throw new Error('No se pudo crear el lote');
        const lot = await lotRes.json();

        // 3. Abrir etiqueta
        document.getElementById('reception-success-modal').remove();
        window.open(`${API_BASE}/api/reception-label/raw/${lot.id}?print=1`, '_blank');
      } catch(e) {
        alert('Error al crear lote: ' + e.message);
        btn.disabled = false;
        btn.innerHTML = '<span style="font-size:22px;">🖨️</span><span>Generar documento (etiqueta 4×6)</span>';
      }
    };

    const btnHtml = `<button class="rsm-btn" id="gen-doc-btn" onclick="window.__genDoc && window.__genDoc(this)" style="width:100%;padding:18px;border:none;border-radius:12px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:white;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;box-shadow:0 4px 12px rgba(30,58,138,.3);">
      <span style="font-size:22px;">🖨️</span><span>Generar documento (etiqueta 4×6)</span>
    </button>`;

    modal.innerHTML = `
      <style>@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}.rsm-box{animation:slideUp .3s ease}.rsm-btn{transition:all .15s}.rsm-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.2)}.rsm-btn:active{transform:translateY(0)}</style>
      <div class="rsm-box" style="background:white;border-radius:20px;max-width:560px;width:92%;box-shadow:0 25px 50px rgba(0,0,0,.3);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="background:linear-gradient(135deg,#10b981 0%,#059669 100%);padding:28px 24px;color:white;text-align:center;">
          <div style="width:64px;height:64px;margin:0 auto 12px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;">✓</div>
          <h2 style="font-size:22px;font-weight:700;margin:0;">¡Materia prima creada!</h2>
          <p style="font-size:14px;margin:8px 0 0;opacity:.95;">Código <code style="background:rgba(255,255,255,.25);padding:3px 12px;border-radius:6px;font-family:monospace;font-size:15px;font-weight:600;">${matData.code || ''}</code></p>
        </div>
        <div style="padding:28px 24px 24px;">
          <p style="color:#4b5563;font-size:14px;margin:0 0 20px;text-align:center;line-height:1.5;">
            La materia prima se ha guardado correctamente.<br>
            <strong>Genera e imprime la etiqueta</strong> para colocarla en el barril o envase.
          </p>
          ${btnHtml}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
            <button class="rsm-btn" onclick="window.open('${infoUrl}','_blank');document.getElementById('reception-success-modal').remove();" style="padding:12px;border:1px solid #d1d5db;border-radius:10px;background:white;color:#1f2937;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
              <span>📱</span><span>Ver QR</span>
            </button>
            <button class="rsm-btn" onclick="navigator.clipboard.writeText('${infoUrl}').then(()=>{const t=this.querySelector('span:last-child');t.textContent='¡Copiado!';setTimeout(()=>t.textContent='Copiar link',1500);}).catch(()=>alert('${infoUrl}'))" style="padding:12px;border:1px solid #d1d5db;border-radius:10px;background:white;color:#1f2937;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
              <span>🔗</span><span>Copiar link</span>
            </button>
          </div>
          <button class="rsm-btn" onclick="document.getElementById('reception-success-modal').remove()" style="width:100%;padding:12px;border:none;border-radius:10px;background:#f3f4f6;color:#6b7280;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;">Continuar</button>
        </div>
      </div>
    `;

    // Conectar el botón con la función async
    setTimeout(() => {
      const btn = document.getElementById('gen-doc-btn');
      if (btn) {
        window.__genDoc = handleGenerar;
      }
    }, 50);

    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  // 4b. Modal de éxito con "Generar documento" prominente
  function showReceptionSuccessModal(lotData, type) {
    const existing = document.getElementById('reception-success-modal');
    if (existing) existing.remove();

    const info = TYPE_INFO[type] || TYPE_INFO.raw;
    const labelUrl = `${API_BASE}/api/reception-label/${type}/${lotData.id}`;
    const infoUrl = `${API_BASE}/api/reception-info/${type}/${lotData.id}`;

    const modal = document.createElement('div');
    modal.id = 'reception-success-modal';
    modal.style.cssText = `
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      animation: fadeIn 0.2s ease;
    `;
    modal.innerHTML = `
      <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .rsm-box { animation: slideUp 0.3s ease; }
        .rsm-btn { transition: all 0.15s; }
        .rsm-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .rsm-btn:active { transform: translateY(0); }
      </style>
      <div class="rsm-box" style="
        background: white; border-radius: 20px; max-width: 560px; width: 92%;
        box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); padding: 28px 24px; color: white; text-align: center;">
          <div style="
            width: 64px; height: 64px; margin: 0 auto 12px;
            background: rgba(255,255,255,0.25); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 700;
          ">✓</div>
          <h2 style="font-size: 22px; font-weight: 700; margin: 0;">¡${info.name} registrado!</h2>
          <p style="font-size: 14px; margin: 8px 0 0; opacity: 0.95;">
            Lote <code style="background: rgba(255,255,255,0.25); padding: 3px 12px; border-radius: 6px; font-family: monospace; font-size: 15px; font-weight: 600;">${lotData.code || ''}</code>
          </p>
        </div>

        <div style="padding: 28px 24px 24px;">
          <p style="color: #4b5563; font-size: 14px; margin: 0 0 20px; text-align: center; line-height: 1.5;">
            La recepción se ha guardado correctamente.<br>
            <strong>Genera e imprime la etiqueta</strong> para colocarla físicamente en el pallet o las cajas.
          </p>

          <button class="rsm-btn" onclick="window.open('${labelUrl}?print=1', '_blank'); document.getElementById('reception-success-modal').remove();" style="
            width: 100%; padding: 18px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white; font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
          ">
            <span style="font-size: 22px;">🖨️</span>
            <span>Generar documento (etiqueta 4×6)</span>
          </button>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <button class="rsm-btn" onclick="window.open('${infoUrl}', '_blank'); document.getElementById('reception-success-modal').remove();" style="
              padding: 12px; border: 1px solid #d1d5db; border-radius: 10px;
              background: white; color: #1f2937; font-size: 13px; font-weight: 600; cursor: pointer;
              display: flex; align-items: center; justify-content: center; gap: 6px;
            ">
              <span>📱</span>
              <span>Ver QR</span>
            </button>

            <button class="rsm-btn" onclick="navigator.clipboard.writeText('${infoUrl}').then(() => { const t = this.querySelector('span:last-child'); t.textContent = '¡Copiado!'; setTimeout(() => t.textContent = 'Copiar link', 1500); }).catch(() => alert('${infoUrl}'))" style="
              padding: 12px; border: 1px solid #d1d5db; border-radius: 10px;
              background: white; color: #1f2937; font-size: 13px; font-weight: 600; cursor: pointer;
              display: flex; align-items: center; justify-content: center; gap: 6px;
            ">
              <span>🔗</span>
              <span>Copiar link</span>
            </button>
          </div>

          <button class="rsm-btn" onclick="document.getElementById('reception-success-modal').remove()" style="
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: #f3f4f6; color: #6b7280; font-size: 13px; font-weight: 500; cursor: pointer;
            margin-top: 6px;
          ">
            Continuar
          </button>
        </div>
      </div>
    `;

    // Click en backdrop para cerrar (pero no si hace click en el modal)
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();
    });

    document.body.appendChild(modal);
  }

  // 5. Cuando se abre el modal de "Nueva materia prima" o "Nueva entrada",
  //    añadir un banner con el código de lote auto-generado
  async function enhanceReceptionModals() {
    // Buscar modales abiertos con el patrón de "Nueva materia prima" o "Nuevo lote"
    const modals = document.querySelectorAll('[class*="fixed"], .modal, [role="dialog"]');
    for (const modal of modals) {
      if (modal.dataset.enhanced) continue;
      const text = (modal.textContent || '');
      
      // Detectar modal de nueva entrada de MP o de nuevo lote
      if (text.includes('Nuevo lote de materia prima') || 
          text.includes('Nueva entrada de') ||
          text.includes('Registrar entrada de')) {
        modal.dataset.enhanced = 'true';
        
        // Detectar tipo
        let type = 'raw';
        if (text.includes('Envase') || text.includes('envase') || text.includes('embalaje')) {
          // Necesitamos ver qué packaging es
          const nameField = modal.querySelector('input[placeholder*="Botella"], input[placeholder*="Caja"], select');
          // Por defecto, intentar adivinar
          if (text.toLowerCase().includes('embalaje') || text.toLowerCase().includes('caja')) type = 'embalaje';
          else type = 'envase';
        }
        
        // Generar código siguiente
        const code = await getNextCode(type);
        if (!code) continue;
        
        // Buscar el campo de "Lote interno" o similar
        const internalLotInput = modal.querySelector('input[placeholder*="INT-"], input[value*="INT-"]');
        if (internalLotInput && !internalLotInput.value) {
          internalLotInput.value = code;
          internalLotInput.readOnly = true;
          internalLotInput.style.background = '#f0f9ff';
          internalLotInput.style.fontWeight = '600';
        }
        
        // Añadir banner arriba
        const banner = document.createElement('div');
        banner.style.cssText = `
          background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
          color: white; padding: 12px 16px; border-radius: 8px;
          margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
          font-size: 13px;
        `;
        banner.innerHTML = `
          <span style="font-size: 18px;">🏷️</span>
          <div style="flex: 1;">
            <strong>Lote generado automáticamente</strong>
            <div style="font-size: 11px; opacity: 0.9; margin-top: 2px;">
              El próximo código es <code style="background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 3px; font-family: monospace;">${code}</code>
            </div>
          </div>
        `;
        // Insertar al principio del formulario
        const formArea = modal.querySelector('.space-y-4, .space-y-3, form') || modal;
        if (formArea.firstChild) formArea.insertBefore(banner, formArea.firstChild);
      }
    }
  }

  // 6. Cuando se navega a /raw-material-lots, mostrar mensaje y redirigir
  function interceptOldLotsRoute() {
    const path = window.location.pathname;
    if (path.includes('/raw-material-lots') && !path.includes('/by-code') && !path.includes('/reverse')) {
      // Mostrar mensaje y redirigir a Materias Primas
      const notice = document.createElement('div');
      notice.style.cssText = `
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 99999; max-width: 500px; width: 90%;
        background: white; border-left: 4px solid #2563eb; border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 16px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        animation: slideDown 0.3s ease;
      `;
      notice.innerHTML = `
        <style>@keyframes slideDown { from { transform: translate(-50%, -100%); } to { transform: translate(-50%, 0); } }</style>
        <h3 style="margin: 0 0 6px; color: #1e3a8a; font-size: 15px;">ℹ️ Apartado integrado</h3>
        <p style="margin: 0 0 12px; color: #4b5563; font-size: 13px; line-height: 1.4;">
          La gestión de lotes ahora se hace directamente desde <strong>Materias Primas</strong> o <strong>Envases</strong>. 
          Al registrar una recepción, el lote se genera automáticamente y puedes imprimir su etiqueta.
        </p>
        <a href="/raw-materials" onclick="this.parentElement.remove()" style="
          display: inline-block; padding: 8px 16px;
          background: #1e3a8a; color: white; border-radius: 6px;
          text-decoration: none; font-size: 13px; font-weight: 600;
        ">Ir a Materias Primas →</a>
      `;
      document.body.appendChild(notice);
      setTimeout(() => notice.remove(), 8000);
    }
  }

  // 7. Exponer funciones globales
  window.__receptionIntegrated = {
    getNextCode,
    showSuccessModal: showReceptionSuccessModal,
    hideOldButton: hideOldLotsButton,
    interceptRoute: interceptOldLotsRoute
  };

  // 8. MutationObserver para aplicar cambios
  const observer = new MutationObserver(() => {
    hideOldLotsButton();
    enhanceReceptionModals();
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // 9. Inicialización
  if (document.readyState === 'complete') {
    setTimeout(() => {
      hideOldLotsButton();
      interceptOldLotsRoute();
      enhanceReceptionModals();
    }, 500);
  } else {
    window.addEventListener('load', () => setTimeout(() => {
      hideOldLotsButton();
      interceptOldLotsRoute();
      enhanceReceptionModals();
    }, 500));
  }

  // Re-aplicar cada 2 segundos por si el sidebar se monta tarde
  setInterval(() => {
    hideOldLotsButton();
  }, 2000);

  console.info('[Reception Integrated] Patch loaded - Lotes integrados en recepción');
})();
    </script>
