      // SPA redirect handler: lee ?p= y restaura la URL
      (function(){
        var p = new URLSearchParams(window.location.search).get('p');
        if (p && p.length > 0) {
          var newUrl = window.location.pathname.replace(/\/$/, '') + p + window.location.hash;
          window.history.replaceState({}, '', newUrl);
        }
      })();
