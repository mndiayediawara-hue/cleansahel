services:
  - type: web
  - name: cleansahel-v2
  - runtime: node
  - plan: free
  - buildCommand: npm install --no-audit && npm run build
  - startCommand: npm start
  - autoDeploy: true
  - envVars:
    - key: NODE_ENV
      value: production
    - key: JWT_SECRET
      generateValue: true
    - key: PORT
      value: 10000
    - key: DB_PATH
      value: /opt/render/project/src/data/cleanerp.db
  - healthCheckPath: /api/health
