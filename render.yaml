services:
  - type: web
    name: cleanerp
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    disk:
      name: cleanerp-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
